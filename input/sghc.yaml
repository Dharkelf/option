# ============================================================
# Eingabedatei — SGHC Call Option Analyse
# Ausfüllen und dann: python main.py --input input/sghc.yaml
# ============================================================

ticker: "SGHC"                # Yahoo Finance / CBOE Ticker
dividend_yield: 0.025         # Jährliche Dividendenrendite (0.025 = 2.5%)

option_type: "call"           # "call" oder "put"
target_leverage: 5.0          # Gewünschter Hebel (Omega)

investment_eur: 400.0        # Geplante Investitionssumme in EUR (für Erlösschätzung)
holding_months: 6             # Geplante Haltedauer in Monaten

# Kurserwartung (optional — eines der beiden ausfüllen oder beide weglassen)
# Wenn angegeben, zeigt das Tool den geschätzten Optionswert bei diesem Kurs.
expected_price: 20.00         # Dein Kursziel in USD am Ende der Haltedauer
# expected_change_pct: 30.0   # Alternativ: erwartete Kursveränderung in %
