# ============================================================
# Option Analysis Tool — Runtime Configuration
# All tunable parameters live here. No hard-coded values in src/.
# ============================================================

# --- Underlying asset ---
underlying:
  ticker: "SGHC"              # Yahoo Finance / CBOE ticker
  dividend_yield: 0.025       # Annual dividend yield (decimal, e.g. 0.025 = 2.5%)

# --- Option search parameters ---
option:
  type: "call"                # "call" or "put"
  target_leverage: 4.0        # Desired Omega (effective leverage)
  leverage_tolerance: 1.5     # Accept candidates where |omega - target| <= tolerance
  min_open_interest: 50       # Skip strikes with OI below this (liquidity guard)
  max_candidates: 10          # Max candidates to return per expiration

# --- User's personal price scenario ---
# Set these to your own price targets for the underlying.
# The tool will compute the option value at each horizon under these prices.
# Set flat_price to null to use the live spot price as the "flat" scenario.
scenario:
  price_3m: 15.50             # Your estimated underlying price in 3 months (USD)
  price_6m: 17.00             # Your estimated underlying price in 6 months (USD)
  price_12m: 20.00            # Your estimated underlying price in 12 months (USD)
  flat_price: null            # "nothing happens" price; null = use current spot

# --- Analysis parameters ---
analysis:
  horizons_months: [3, 6, 12]
  lookback_years: 1           # Historical window for realised volatility calculation
  risk_free_ticker: "^TNX"    # 10yr US treasury yield (Yahoo Finance)

# --- flatex.at transaction costs ---
# Source: https://www.flatex.at/konditionen/ (verify before use)
costs:
  flatex_base_fee_eur: 5.90         # Base commission per trade (EUR)
  flatex_exchange_fee_eur: 3.00     # Exchange/settlement fee per trade (EUR)
  spread_buffer_pct: 2.0            # Add X% to option ask price for realistic fill
  eur_usd_rate: 1.09                # EUR/USD for cost conversion (update manually)
  contracts: 1                      # Number of contracts to model (1 contract = 100 shares)

# --- Logging ---
logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR

# --- Storage paths ---
paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
