# ============================================================
# Technische Konfiguration — settings.yaml
# Nutzerspezifische Eingaben gehören in input/<name>.yaml
# ============================================================

# --- Optionssuche (technische Schranken) ---
option:
  leverage_tolerance: 1.5     # Akzeptierte Abweichung vom Ziel-Omega
  min_open_interest: 50       # Liquidiäts-Minimum (Strikes darunter werden ignoriert)
  max_candidates: 10          # Max. Kandidaten pro Verfallsdatum

# --- Analyseparameter ---
analysis:
  horizons_months: [3, 6, 12] # Standard-Horizonte für Tabellen und Sensitivitätsgrid
  lookback_years: 1           # Historisches Fenster für realisierte Volatilität
  risk_free_ticker: "^TNX"    # 10-Jahres-US-Staatsanleihenrendite (Yahoo Finance)

# --- flatex.at Transaktionskosten ---
# Quelle: https://www.flatex.at/konditionen/ (vor Kauf prüfen!)
costs:
  flatex_base_fee_eur: 5.90         # Grundgebühr pro Trade (EUR)
  flatex_exchange_fee_eur: 3.00     # Börsengebühr/Settlement pro Trade (EUR)
  spread_buffer_pct: 2.0            # Aufschlag auf Ask / Abschlag auf Bid (realistischer Fill)
  eur_usd_rate: 1.09                # EUR/USD-Kurs (manuell aktualisieren)
  investment_eur: 400.0             # Default-Investitionssumme (wird durch input/*.yaml überschrieben)

# --- Logging ---
logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR

# --- Datenpfade ---
paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
